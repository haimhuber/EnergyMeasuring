<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="navbar.css">
</head>

<body>

    <!-- Tariff Settings Modal -->
    <div id="tariff-modal-overlay" class="tariff-modal-overlay hidden">
        <div class="tariff-modal" role="dialog" aria-modal="true" aria-labelledby="tariff-modal-title">
            <div class="tariff-modal-header">
                <span id="tariff-modal-title">Settings</span>
                <button id="tariff-modal-close" class="tariff-modal-close" aria-label="Close">×</button>
            </div>
            <div class="tariff-modal-body">
                <form id="tariff-form">
                    <table class="tariff-table">
                        <thead>
                            <tr>
                                <th>Season</th>
                                <th>Off Rate</th>
                                <th>Peak Rate</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Winter</td>
                                <td><input type="number" step="0.0001" min="0" id="winter-off" required></td>
                                <td><input type="number" step="0.0001" min="0" id="winter-peak" required></td>
                            </tr>
                            <tr>
                                <td>Shoulder</td>
                                <td><input type="number" step="0.0001" min="0" id="shoulder-off" required></td>
                                <td><input type="number" step="0.0001" min="0" id="shoulder-peak" required></td>
                            </tr>
                            <tr>
                                <td>Summer</td>
                                <td><input type="number" step="0.0001" min="0" id="summer-off" required></td>
                                <td><input type="number" step="0.0001" min="0" id="summer-peak" required></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="tariff-table">
                        <label for="tariff-vat">VAT Rate:</label>
                        <input type="number" step="0.0001" min="0" id="tariff-vat" required
                            style="width:100px; margin-left:8px;">
                    </div>
                    <div class="location-field">
                        <label for="nav-location">Location</label>

                        <input type="text" id="nav-location" list="cities-list" placeholder="Start typing city..."
                            autocomplete="off">

                        <datalist id="cities-list"></datalist>
                    </div>
                    <button type="submit" class="btn-save-tariff">Save</button>
                </form>
            </div>
        </div>
    </div>


    <div class="navbar">
        <div class="navbar-inner">
            <span class="navbar-logo">
                <svg width="110" height="32" viewBox="0 0 110 32" xmlns="http://www.w3.org/2000/svg">
                    <text class="main-text" x="-1" y="26" font-family="DM Sans, Arial, sans-serif" font-weight="900"
                        font-size="30">ABB</text>
                </svg>
                <button onclick="createChatGptModal()" id="btn-chatgpt" class="chat-btn"
                    title="Chat with ChatGPT">🤖</button>
            </span>
            <span class="navbar-sub">Energy Monitoring System</span>
            <div class="navbar-action-buttons">
                <button onclick="window.location.href='index.html'" class="action-btn">Report & Billing</button>
            </div>
            <div id="tariff-summary-bar" class="tariff-summary-bar">
                <button id="btn-settings" class="btn-settings" title="Settings">⚙️</button>
                <div class="tariff-season" id="tariff-winter">
                    <span class="tariff-emoji">❄️</span>
                    <span class="tariff-label">Winter</span>
                    <span class="tariff-rates">Off: <span class="tariff-off">-</span> | Peak: <span
                            class="tariff-peak">-</span></span>
                </div>
                <div class="tariff-season" id="tariff-shoulder">
                    <span class="tariff-emoji">🍂</span>
                    <span class="tariff-label">Shoulder</span>
                    <span class="tariff-rates">Off: <span class="tariff-off">-</span> | Peak: <span
                            class="tariff-peak">-</span></span>
                </div>
                <div class="tariff-season" id="tariff-summer">
                    <span class="tariff-emoji">🌞</span>
                    <span class="tariff-label">Summer</span>
                    <span class="tariff-rates">Off: <span class="tariff-off">-</span> | Peak: <span
                            class="tariff-peak">-</span></span>
                </div>
                <!-- <div class="tariff-vat-summary">VAT: <span id="tariff-vat-summary">-</span></div> -->
            </div>
        </div>
        <div class="navbar-right">
            <span class="navbar-user">Welcome, <span id="nav-username"></span></span>
            <button onclick="logout()" id="btn-logout" class="btn-logout">Logout</button>
            <span id="nav-time"></span>
            <span>Site: <span id="navbar-location">-</span></span>
        </div>
    </div>


</body>

</html>
