<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABB - Energy Report Generator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ✅ Chart.js with defer -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  :root { --red:#FF000F; --red-dk:#CC000C; --black:#0F0F0F; --dark:#1A1A1A; --mid:#555; --light:#F4F4F4; --border:#E2E2E2; --peak-bg:#FFF3F3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:#111; color:var(--black); min-height:100vh; }
  .nav { background:var(--black); padding:0 48px; display:flex; align-items:center; justify-content:space-between; height:56px; position:sticky; top:0; z-index:100; }
  .nav-logo { font-size:28px; font-weight:700; letter-spacing:5px; color:#fff; display:flex; align-items:center; gap:8px; }
  .nav-sub { font-size:13px; font-weight:500; letter-spacing:3px; text-transform:uppercase; color:#555; }
  .selector-section { background:var(--red); padding:48px; position:relative; overflow:hidden; }
  /* watermark removed to use logo images instead */
  .selector-section::before { content:''; }
  .selector-label { font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.6); margin-bottom:10px; }
  .selector-title { font-size:38px; font-weight:700; color:#fff; margin-bottom:36px; }
  .controls { display:grid; grid-template-columns:1.4fr 1fr 1fr 0.8fr auto; gap:16px; align-items:end; max-width:1050px; }
  .ctrl-group label { display:block; font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:rgba(250, 250, 250, 0.65); margin-bottom:10px; }
  .ctrl-group select, .ctrl-group input[type="date"] {
    width:100%; background:rgba(226, 221, 221, 0.12); border:1px solid rgba(255, 250, 250, 0.25);
    color:#fff; padding:15px 18px; font-family:'DM Sans',sans-serif; font-size:17px; font-weight:600;
    appearance:none; -webkit-appearance:none; cursor:pointer; outline:none; transition:background 0.15s, border-color 0.15s;
  }
  .ctrl-group select:hover, .ctrl-group input[type="date"]:hover { background:rgba(255,255,255,0.2); border-color:rgba(255,255,255,0.5); }
  /* Options in the dropdown: use dark background and white text so selected items are visible */
  .ctrl-group select option { background:#111; color:#fff; }
  /* Improve visibility when hovering/selecting options (browser support varies) */
  .ctrl-group select option:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .ctrl-group select option:checked { background: rgba(255,255,255,0.08); color: #0c0c0c; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(1); opacity:0.6; cursor:pointer; }
  .view-toggle { display:flex; border:1px solid rgba(255,255,255,0.25); overflow:hidden; }
  /* 3D style container: give perspective so children can appear raised */
  .view-toggle { display:flex; border:1px solid rgba(255,255,255,0.25); overflow:hidden; perspective:900px; -webkit-perspective:900px; transform-style:preserve-3d; }
  .view-toggle input[type="radio"] { display:none; }

  /* 3D raised button style */
  .view-toggle .vt-btn {
    display:block;
    padding:12.5px 22px;
    font-family:'DM Sans',sans-serif;
    font-size:15px;
    font-weight:600;
    color:rgba(8, 8, 8, 0.6);
    background:linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(19,19,19,0.08) 100%);
    transition:transform 220ms cubic-bezier(.2,.9,.2,1), box-shadow 220ms, color 160ms, background 160ms;
    white-space:nowrap;
    border-right:1px solid rgba(255,255,255,0.06);
    cursor:pointer;
    position:relative;
    border-radius:6px 0 0 6px; /* left-most default radius, adjusted by sibling rules below */
    /* create the illusion of depth by translating along Z axis */
    transform: translateZ(8px);
    box-shadow: 0 8px 18px rgba(241, 241, 241, 0.45), 0 2px 4px rgba(0,0,0,0.25) ;
    overflow:visible;
  }
  /* remove right border on last button */
  .view-toggle label:last-child .vt-btn { border-right:none; border-radius:0 6px 6px 0; }

  /* thin bevel / edge to enhance thickness */
  .view-toggle .vt-btn::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 6px;
    background: linear-gradient(180deg, rgba(0,0,0,0.22), rgba(0,0,0,0.45));
    border-radius: 0 0 6px 6px;
    z-index: -1;
    opacity: 0.9;
    transform: translateZ(-8px) scaleY(1);
  }

  /* Hover: slightly lift and brighten */
  .view-toggle .vt-btn:hover {
    transform: translateZ(14px) translateY(-2px);
    box-shadow: 0 12px 30px rgba(3,3,3,0.55), 0 4px 8px rgba(0,0,0,0.32);
    color: #fff;
  }

  /* Active (mouse down): press down */
  .view-toggle .vt-btn:active {
    transform: translateZ(2px) translateY(0px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.45);
  }

  /* Checked state: emphasise as the selected raised button */
  .view-toggle input[type="radio"]:checked + .vt-btn {
    background: linear-gradient(180deg, rgba(255,20,20,0.95), rgba(200,16,16,0.95));
    color: #fff;
    transform: translateZ(20px) translateY(-2px) rotateX(2deg);
    box-shadow: 0 18px 36px rgba(255,0,15,0.16), 0 6px 12px rgba(0,0,0,0.32);
  }

  /* make sure adjacent buttons appear flush (remove double radius) */
  .view-toggle label:first-child .vt-btn { border-radius:6px 0 0 6px; }
  .view-toggle label:last-child .vt-btn { border-radius:0 6px 6px 0; }
  .btn-generate { background:var(--black); color:#fff; border:none; padding:15px 32px; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; transition:background 0.15s, transform 0.1s; white-space:nowrap; display:flex; align-items:center; gap:8px; height:100%; }
  .btn-generate:hover { background:#333; }
  .btn-generate:active { transform:scale(0.97); }
  .btn-generate .arrow { transition:transform 0.2s; }
  .btn-generate:hover .arrow { transform:translateX(4px); }
  .status-bar { background:var(--dark); padding:12px 48px; display:flex; align-items:center; gap:12px; font-size:14px; font-family:'DM Mono',monospace; color:#666; min-height:48px; }
  .status-dot { width:7px; height:7px; border-radius:50%; background:#444; flex-shrink:0; }
  .status-dot.active { background:#00cc66; box-shadow:0 0 6px #00cc66; }
  .status-dot.loading { background:var(--red); animation:pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .report-area { padding:40px 48px; background:#1a1a1a; min-height:calc(100vh - 220px); }
  .placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:400px; opacity:0.25; color:#fff; text-align:center; gap:16px; }
  .placeholder .big { font-size:72px; font-weight:700; letter-spacing:8px; }
  .placeholder .sm { font-size:12px; letter-spacing:3px; text-transform:uppercase; }
  .report-card { background:#fff; box-shadow:0 16px 60px rgba(0,0,0,0.4); display:none; animation:slideUp 0.35s cubic-bezier(0.22,1,0.36,1); }
  .report-card.visible { display:block; }
  @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  .rpt-header { background:var(--red); padding:28px 40px; display:flex; align-items:center; justify-content:space-between; }
  .rpt-logo { font-size:40px; font-weight:700; letter-spacing:5px; color:#fff; }
  .rpt-header-right { text-align:right; }
  .rpt-header-right .rpt-type { font-size:12px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.6); margin-bottom:4px; }
  .rpt-header-right .rpt-name { font-size:24px; font-weight:600; color:#fff; }
  .rpt-subbar { background:var(--dark); padding:9px 40px; display:flex; justify-content:space-between; align-items:center; }
  .rpt-subbar .sl { font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#fff; }
  .rpt-subbar .sr { font-size:13px; color:#666; font-family:'DM Mono',monospace; }
  .rpt-meta { display:grid; grid-template-columns:repeat(5,1fr); border-bottom:1px solid var(--border); }
  .rpt-meta-cell { padding:14px 20px; border-right:1px solid var(--border); text-align:center; }
  .rpt-meta-cell:last-child { border-right:none; }
  .rpt-meta-cell .ml { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#aaa; margin-bottom:6px; }
  .rpt-meta-cell .mv { font-size:17px; font-weight:700; color:var(--dark); }
  .rpt-legend { background:var(--light); padding:10px 40px; display:flex; gap:28px; border-bottom:1px solid var(--border); }
  .rpt-legend-item { display:flex; align-items:center; gap:7px; font-size:14px; color:#555; }
  .sw { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
  .sw.pk { background:var(--red); }
  .sw.op { background:var(--dark); }
  .rpt-body { display:grid; grid-template-columns:1fr 400px; border-bottom:1px solid var(--border); }
  .rpt-chart-panel { padding:28px 28px 28px 40px; border-right:1px solid var(--border); }
  .rpt-chart-title { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#aaa; margin-bottom:16px; }
  .chart-container { position:relative; height:300px; }
  .chart-pills { display:flex; gap:12px; margin-top:20px; }
  .pill { flex:1; padding:12px 16px; }
  .pill.pk { background:var(--peak-bg); border-left:3px solid var(--red); }
  .pill.op { background:#f5f5f5; border-left:3px solid var(--dark); }
  .pill .pl { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#888; margin-bottom:4px; }
  .pill .pv { font-size:24px; font-weight:800; color:var(--black); }
  .pill .ps { font-size:16px; color:#222121; margin-top:2px; font-family:'DM Mono',monospace; }
  .rpt-table-panel { overflow: visible; }
  .rpt-table-wrap { padding:0 24px; max-height:55vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .rpt-table { width:100%; border-collapse:collapse; font-size:13px; }
  .rpt-table thead { position:sticky; top:0; z-index:2; }
  .rpt-table thead tr { border-bottom:2px solid var(--red); }
  .rpt-table th { padding:12px 8px; font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#aaa; text-align:center; background:#fff; }
  .rpt-table th:first-child { text-align:left; }
  .rpt-table td { padding:10px 8px; text-align:center; border-bottom:1px solid #f2f2f2; color:#333; }
  .rpt-table td:first-child { text-align:left; font-family:'DM Mono',monospace; font-size:12px; }
  .rpt-table td.n { font-family:'DM Mono',monospace; font-size:12px; }
  .rpt-table tr.pk-row td { background:var(--peak-bg); }
  .tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:2px 7px; border-radius:2px; color:#fff; }
  .tag.pk { background:var(--red); }
  .tag.op { background:var(--dark); }
  .rpt-totals { margin:0 40px; border-top:2px solid var(--red); padding:20px 0 28px; display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; }
  .rpt-totals-lines { display:flex; flex-direction:column; gap:8px; }
  .rpt-tot-line { display:flex; justify-content:space-between; font-size:15px; color:#555; padding-bottom:8px; border-bottom:1px solid #f0f0f0; }
  .rpt-tot-line-peak { display:flex; justify-content:space-between; font-size:15px; color:#b41c1c; padding-bottom:8px; border-bottom:1px solid #f0f0f0; }
  .rpt-tot-line-off { display:flex; justify-content:space-between; font-size:15px; color:#363636; padding-bottom:8px; border-bottom:1px solid #f0f0f0; }
  .rpt-tot-line-total { display:flex; justify-content:space-between; font-size:16px; color:#1c51e0; padding-bottom:8px; border-bottom:1px solid #f0f0f0; }
  .rpt-tot-line:last-child { border-bottom:none; }
  .rpt-tot-line .tv { font-family:'DM Mono',monospace; font-weight:500; color:var(--dark); }
  .rpt-note { font-size:12px; color:#161515; margin-top:8px; }
  .rpt-total-box { background:var(--red); color:#fff; padding:22px 32px; text-align:center; min-width:170px; }
  .rpt-total-box .tbl { font-size:12px; letter-spacing:2px; text-transform:uppercase; opacity:0.75; margin-bottom:8px; }
  .rpt-total-box .tba { font-size:40px; font-weight:700; line-height:1; }
  .rpt-total-box .tbc { font-size:15px; opacity:0.7; margin-top:4px; }
  .rpt-export-bar { padding:14px 40px; background:#f0f0f0; display:flex; justify-content:flex-end; border-top:1px solid var(--border); }
  .btn-print { display:inline-flex; align-items:center; gap:7px; background:var(--red); color:#fff; border:none; padding:10px 24px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:background 0.15s; }
  .btn-print:hover { background:var(--red-dk); }
  .btn-print svg { width:14px; height:14px; fill:#fff; }
  .rpt-footer { background:var(--dark); padding:10px 40px; display:flex; justify-content:space-between; font-size:12px; color:#555; font-family:'DM Mono',monospace; }
  .rpt-footer .fa { color:var(--red); font-weight:700; letter-spacing:2px; margin-right:5px; }
  .no-data { display:none; padding:60px; text-align:center; color:#aaa; }
  .no-data.visible { display:block; }
  .no-data .nd-icon { font-size:48px; margin-bottom:16px; opacity:0.4; }
  .no-data .nd-text { font-size:14px; }

  /* =========================
     PRINT PDF: ABB header + CLEAR ROW LIST (no table)
     ========================= */
  .print-only-records { display:none; }

  #print-records { font-family:'DM Sans',sans-serif; }
  #print-records .pdf-page { width:100%; color:#111; }

  #print-records .pdf-header {
    background: var(--red);
    color:#fff;
    padding:18px 18px 14px;
    border-radius:12px;
    position:relative;
    overflow:hidden;
  }
  #print-records .pdf-header::after{
    content:"ABB";
    position:absolute;
    right:-16px;
    top:-46px;
    font-size:140px;
    font-weight:900;
    letter-spacing:10px;
    color:rgba(0,0,0,0.12);
    pointer-events:none;
    user-select:none;
  }
  #print-records .pdf-head-row{
    position:relative; z-index:1;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  #print-records .pdf-logo{
    font-size:32px;
    font-weight:900;
    letter-spacing:6px;
    line-height:1;
  }
  #print-records .pdf-title{
    text-align:right;
  }
  #print-records .pdf-title .t1{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:.75;
    margin-bottom:6px;
  }
  #print-records .pdf-title .t2{
    font-size:18px;
    font-weight:800;
    line-height:1.15;
  }
  #print-records .pdf-chips{
    position:relative; z-index:1;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  #print-records .chip{
    background: rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    padding:6px 10px;
    border-radius:999px;
    font-size:11px;
  }

  #print-records .pdf-summary{
    margin-top:12px;
    display:grid;
    grid-template-columns: 1.2fr 1fr 1fr;
    gap:10px;
  }
  #print-records .sum-total{
    background:#111;
    color:#fff;
    border-radius:12px;
    padding:12px 12px;
  }
  #print-records .sum-total .k{
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:.7;
    margin-bottom:6px;
    font-weight:800;
  }
  #print-records .sum-total .v{
    font-size:24px;
    font-weight:900;
    line-height:1;
  }
  #print-records .sum-box{
    background:#fff;
    border:1px solid #eee;
    border-radius:12px;
    padding:12px 12px;
  }
  #print-records .sum-box.pk{ border-left:5px solid var(--red); }
  #print-records .sum-box.op{ border-left:5px solid var(--dark); }
  #print-records .sum-box .k{
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#999;
    font-weight:900;
    margin-bottom:6px;
  }
  #print-records .sum-box .v{
    font-size:18px;
    font-weight:900;
    color:#111;
  }
  #print-records .sum-box .s{
    font-family:'DM Mono',monospace;
    font-size:12px;
    color:#666;
    margin-top:4px;
  }

  /* clear row list */
  #print-records .pdf-section-title{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:8px 2px;
  }
  #print-records .pdf-section-title .l{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    font-weight:900;
    color:#111;
  }
  #print-records .pdf-section-title .r{
    font-family:'DM Mono',monospace;
    font-size:12px;
    color:#666;
  }

  #print-records .rowlist{
    margin-top:6px;
    border:1px solid #eee;
    border-radius:12px;
    overflow:hidden;
    background:#fff;
  }
  #print-records .row{
    display:grid;
    grid-template-columns: 120px 1fr 1fr 1fr 1fr;
    gap:8px;
    padding:10px 12px;
    border-bottom:1px solid #eee;
    align-items:center;
  }
  #print-records .row:last-child{ border-bottom:none; }
  #print-records .row:nth-child(even){ background:#fafafa; }

  #print-records .row .d{
    font-family:'DM Mono',monospace;
    font-size:12px;
    font-weight:700;
    color:#111;
  }
  #print-records .cell .k{
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#999;
    font-weight:900;
    margin-bottom:3px;
  }
  #print-records .cell .v{
    font-family:'DM Mono',monospace;
    font-size:12px;
    color:#111;
    font-weight:700;
  }
  #print-records .cell .v strong{ font-weight:900; }

  #print-records .pdf-footer{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #eee;
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-family:'DM Mono',monospace;
    font-size:11px;
    color:#777;
  }
  #print-records .pdf-footer .abb{
    color:var(--red);
    font-weight:900;
    letter-spacing:2px;
  }

  /* avoid breaking a row */
  #print-records .row{ break-inside: avoid; page-break-inside: avoid; }

  @media print {
    body { background:#fff; }
    body * { visibility:hidden !important; }

    #print-records, #print-records * { visibility: visible !important; }

    #print-records {
      display:block !important;
      position:absolute;
      left:0; top:0;
      width:100%;
      padding:18px;
      background:#fff;
    }

    table, .rpt-table-panel, .rpt-table-wrap { display:none !important; }
  }

    /* Print-specific high-contrast overrides: make header and chips darker/black-on-white for PDFs */
    @media print {
      #print-records .pdf-header {
        background: #ffffff !important;
        color: #111 !important;
      }
      /* remove oversized watermarked 'ABB' in print header */
      #print-records .pdf-header::after { display:none !important; }

      #print-records .pdf-title .t1,
      #print-records .pdf-title .t2 {
        color: #111 !important;
        font-weight: 900 !important;
      }

      #print-records .pdf-chips { margin-top:8px; }
      #print-records .chip {
        background: #fff !important;
        color: #111 !important;
        border-color: rgba(0,0,0,0.08) !important;
        font-weight:900 !important;
      }
    }

    /* Emphasize Total Due block specifically for print */
    @media print {
      #print-records .sum-total {
        background: #fff !important;
        color: #111 !important;
        border: 2px solid rgba(0,0,0,0.06) !important;
        padding: 16px !important;
      }
      #print-records .sum-total .k {
        color: #111 !important;
        font-weight: 900 !important;
        font-size: 12px !important;
        letter-spacing: 2px !important;
      }
      #print-records .sum-total .v {
        color: #111 !important;
        font-weight: 900 !important;
        font-size: 28px !important;
      }
      /* make currency tighter and bold */
      #print-records .sum-total .v span { font-weight:900 !important; font-size:14px !important; color:#111 !important; }
    }
</style>
</head>

<body>
<div class="nav">
  <span class="nav-logo">
    <svg width="86" height="20" viewBox="0 0 86 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <text x="0" y="18" font-family="DM Sans, Arial, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">ABB</text>
    </svg>
  </span>
  <span class="nav-sub">Energy Monitoring System</span>
</div>

<div class="selector-section">
  <div class="selector-label">Report Generator</div>
  <div class="selector-title">Generate Energy Invoice</div>
  <div class="controls">
    <div class="ctrl-group">
      <label>Breaker</label>
      <select id="sel-breaker">
  <option value="">— Select breaker —</option>
</select>
    </div>
    <div class="ctrl-group">
      <label>From</label>
      <input type="date" id="sel-from">
    </div>
    <div class="ctrl-group">
      <label>To</label>
      <input type="date" id="sel-to">
    </div>

<!-- ✅ Printable "records only" container -->
<div id="print-records" class="print-only-records"></div>

<script>
const API_BASE = "";

/**
 * ✅ BREAKERS is a real object (not a Promise)
 * Format we keep everywhere:
 * BREAKERS["1"] = { id:"1", name:"..." }
 */
let BREAKERS = {};

let chartInstance = null;

function setStatus(type, text) {
  document.getElementById('status-dot').className = 'status-dot' + (type ? ' '+type : '');
  document.getElementById('status-text').textContent = text;
}

function fmtMoney(n) { return Number(n || 0).toFixed(2); }
function fmtRate(n) {
  if (n === "-" || n == null) return "-";
  const x = Number(n);
  if (!Number.isFinite(x)) return "-";
  return x.toFixed(4);
}
function fmtKwh(n) {
  const x = Number(n || 0);
  return Number.isInteger(x) ? String(x) : x.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
}
function seasonLabel(s) {
  if (s === "winter") return "Winter";
  if (s === "summer") return "Summer";
  if (s === "shoulder") return "Transition";
  return s || "-";
}


function gbStamp(iso) {
  if (!iso) return "";
  const s = String(iso);
  if (!s.includes(" ")) return s;
  const [d,t] = s.split(" ");
  const [Y,M,D] = d.split("-");
  return `${D}/${M} ${t}`;
}
function gbDate(isoDate) {
  const s = String(isoDate || "");
  // monthly stamp (YYYY-MM)
  if (/^\d{4}-\d{2}$/.test(s)) return gbMonth(s);
  const [Y,M,D] = s.split("-");
  return `${D}/${M}/${Y}`;
}
function shortDay(isoDate) {
  const [Y,M,D] = String(isoDate).split("-");
  return `${D}/${M}`;
}
function hhFromStamp(stamp) {
  const s = String(stamp || "");
  if (s.includes(" ")) return s.split(" ")[1];
  return s;
}

/* Format YYYY-MM into a short month label (e.g. Mar 2025) */
function gbMonth(ym) {
  const s = String(ym || "");
  const mnames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const parts = s.split('-');
  if (parts.length < 2) return s;
  const Y = parts[0];
  const M = Number(parts[1]);
  if (!M || M < 1 || M > 12) return s;
  return `${mnames[M-1]} ${Y}`;
}

function shortMonth(ym) { return gbMonth(ym); }

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function ensureChart() {
  if (window.Chart) return;
  await loadScript("/vendor/chart.umd.min.js");
  if (!window.Chart) throw new Error("Chart.js failed to load (CDN + local fallback)");
}

function sortByTimestampAsc(rows) {
  return [...rows].sort((a,b) => String(a.timestamp).localeCompare(String(b.timestamp)));
}

/* ✅ Print only the "records" list (no table) */
function printRecordsOnly() {
  const pr = document.getElementById("print-records");
  pr.style.display = "block";
  window.print();
  pr.style.display = "none";
}

/* ✅ If user selected hourly - aggregate to DAILY for PDF list */
function aggregateHourlyToDaily(rows) {
  const map = new Map(); // date -> {timestamp, peak_kwh, off_kwh, kwh, amount}
  rows.forEach(r => {
    const ts = String(r.timestamp || "");
    const date = ts.includes(" ") ? ts.split(" ")[0] : ts.slice(0,10);
    if (!date) return;

    const type = r.type || "Off-Peak";
    const pk = (type === "Peak");

    const kwh = Number(r.kwh || 0);
    const amount = Number(r.amount || 0);

    if (!map.has(date)) {
      map.set(date, { timestamp: date, peak_kwh: 0, off_kwh: 0, kwh: 0, amount: 0 });
    }
    const agg = map.get(date);
    agg.kwh += kwh;
    agg.amount += amount;
    if (pk) agg.peak_kwh += kwh;
    else agg.off_kwh += kwh;
  });

  return [...map.values()].sort((a,b) => String(a.timestamp).localeCompare(String(b.timestamp)));
}

/* Fetch consumption JSON helper */
async function fetchConsumption(breakerId, from, to, view) {
  const url = `${API_BASE}/api/consumption?breaker_id=${breakerId}&from_date=${encodeURIComponent(from)}&to_date=${encodeURIComponent(to)}&view=${encodeURIComponent(view)}`;
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) {
    const t = await resp.text().catch(()=>"");
    throw new Error(`API error (${resp.status}): ${t || resp.statusText}`);
  }
  return await resp.json();
}

// Fetch last raw parsed CSV rows for a breaker (debug helper)
async function getLastSamples(breakerId, limit = 10) {
  const url = `${API_BASE}/api/debug-rows?breaker_id=${breakerId}&limit=${limit}`;
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) {
    const t = await resp.text().catch(()=>"");
    throw new Error(`Debug API error (${resp.status}): ${t || resp.statusText}`);
  }
  return await resp.json();
}

// Render last samples into the no-data panel for quick debugging
async function showLastSamplesInNoData(breakerId, limit = 10) {
  const noData = document.getElementById('no-data');
  // remove previous debug area if exists
  const prev = document.getElementById('no-data-debug');
  if (prev) prev.remove();

  const dbg = document.createElement('div');
  dbg.id = 'no-data-debug';
  dbg.style.marginTop = '12px';

  const btn = document.createElement('button');
  btn.className = 'btn-generate';
  btn.style.background = '#222';
  btn.style.padding = '8px 12px';
  btn.textContent = `Show last ${limit} samples`;
  dbg.appendChild(btn);

  const pre = document.createElement('pre');
  pre.id = 'no-data-debug-pre';
  pre.style.display = 'none';
  pre.style.marginTop = '10px';
  pre.style.padding = '10px';
  pre.style.maxHeight = '320px';
  pre.style.overflow = 'auto';
  pre.style.background = '#111';
  pre.style.color = '#fff';
  pre.style.borderRadius = '6px';
  dbg.appendChild(pre);

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = 'Loading...';
    try {
      const json = await getLastSamples(breakerId, limit);
      pre.textContent = JSON.stringify(json, null, 2);
      pre.style.display = 'block';
      btn.textContent = 'Refresh samples';
    } catch (err) {
      pre.textContent = `Error: ${err.message || err}`;
      pre.style.display = 'block';
      btn.textContent = original;
    } finally {
      btn.disabled = false;
    }
  });

  noData.appendChild(dbg);
}

/* Render a table body string for rows (hourly or daily) */
function buildTableRowsHtml(rows, view) {
  let tableRows = "";

  if (view === 'monthly') {
    // monthly summaries already grouped server-side
    rows.forEach(r => {
      const dPk  = Number(r.peak_kwh || 0);
      const dOff = Number(r.off_kwh || 0);
      const dTot = Number(r.kwh || 0);
      const dAmt = Number(r.amount || 0);

      tableRows += `<tr>
        <td>${gbMonth(r.timestamp)}</td>
        <td>
          <span class="tag pk" style="margin-right:3px">Pk: ${fmtKwh(dPk)}</span>
          <span class="tag op">Off: ${fmtKwh(dOff)}</span>
        </td>
        <td class="n">${fmtKwh(dTot)}</td>
        <td class="n">Monthly</td>
        <td class="n">${fmtMoney(dAmt)}</td>
      </tr>`;
    });
    return tableRows;
  }

  if (view === 'daily') {
    rows.forEach(r => {
      const dPk  = Number(r.peak_kwh || 0);
      const dOff = Number(r.off_kwh || 0);
      const dTot = Number(r.kwh || 0);
      const dAmt = Number(r.amount || 0);

      tableRows += `<tr>
        <td>${gbDate(r.timestamp)}</td>
        <td>
          <span class="tag pk" style="margin-right:3px">Pk: ${fmtKwh(dPk)}</span>
          <span class="tag op">Off: ${fmtKwh(dOff)}</span>
        </td>
        <td class="n">${fmtKwh(dTot)}</td>
        <td class="n">Mixed</td>
        <td class="n">${fmtMoney(dAmt)}</td>
      </tr>`;
    });
    return tableRows;
  }

  // default: hourly
  rows.forEach(r => {
    const type = r.type || "Off-Peak";
    const pk = (type === "Peak");
    const kwh = Number(r.kwh || 0);

    tableRows += `<tr class="${pk ? 'pk-row' : ''}">
      <td>${gbStamp(r.timestamp)}</td>
      <td><span class="tag ${pk?'pk':'op'}">${pk?'Peak':'Off-Peak'}</span></td>
      <td class="n">${fmtKwh(kwh)}</td>
      <td class="n">${fmtRate(r.rate)}</td>
      <td class="n">${fmtMoney(r.amount)}</td>
    </tr>`;
  });

  return tableRows;
}

/* Generate combined report for breakers 1,4,7 and render three stacked tables */
async function generateMultiBreakerReport() {
  const ids = [1,4,7];
  const from = document.getElementById('sel-from').value;
  const to   = document.getElementById('sel-to').value;
  const view = document.querySelector('input[name="view"]:checked').value;
  const clearSelectedData = document.getElementById("sel-breaker"); // if no specific breaker selected, treat as "multi-breaker total cost" report and clear old data
  clearSelectedData.value = ""; // Clear old data
  if (!from || !to) { setStatus('', 'Please select a date range.'); return; }

  const card = document.getElementById('report-card');
  const placeholder = document.getElementById('placeholder');
  const noData = document.getElementById('no-data');

  placeholder.style.display = 'none';
  noData.classList.remove('visible');
  card.classList.remove('visible');
  card.innerHTML = "";

  document.getElementById("print-records").innerHTML = "";

  setStatus('loading', 'Fetching multi-breaker data...');

  try {
    const parts = [];
    const printParts = [];
    for (const id of ids) {
      // eslint-disable-next-line no-await-in-loop
      const d = await fetchConsumption(id, from, to, view);
      const rows = Array.isArray(d.rows) ? sortByTimestampAsc(d.rows) : [];

      if (!rows.length) {
        parts.push(`<div style="padding:18px;border:1px solid #eee;margin-bottom:12px;">No data for ${breaker.name} (${id}) in selected period.</div>`);
        continue;
      }

      const tableRows = buildTableRowsHtml(rows, view);

      const part = `
        <div style="border:1px solid #eee;border-radius:8px;margin-bottom:18px;overflow:hidden;background:#fff;">
          <div style="padding:12px 16px;border-bottom:1px solid #f2f2f2;display:flex;justify-content:space-between;align-items:center;">
            <div style="font-weight:800">${breaker.name} — Breaker ID ${breaker.id}</div>
            <div style="font-family:DM Mono,monospace;font-size:12px;color:#666">Invoice: ${d.invoice_no || ''}</div>
          </div>
          <div>
          <div style="padding:12px 12px;">
            <div style="overflow:auto;">
              <table class="rpt-table" style="width:100%;">
                <thead><tr>
                  <th>${view==='hourly'?'Time':'Date'}</th>

                </tr></thead>
                <tbody>${tableRows}</tbody>
              </table>
            </div>
          </div>
          <div style="padding:12px 12px; border-top:1px solid #f2f2f2; display:flex; justify-content:flex-end; gap:20px;">
    <div style="font-weight:700;">Total due: <span style="font-family:DM Mono,monospace;">${fmtMoney(d.total_amount || 0)} ILS</span></div>
    <hr style="margin:10px 0; height:6px; border:none; background:#e6e6e6;" />
    <button class="btn-print" onclick="printRecordsOnly()">Print records</button>
    </div>
    <hr style="margin:30px 0; height:6px; border: solid; background:#e6e6e6;" />
      `;

      parts.push(part);

      // For print: a compact summary + rows as on single report
  const dailyRowsForPrint = (view === "daily" || view === "monthly") ? rows : aggregateHourlyToDaily(rows);
      let pdfRows = "";
      dailyRowsForPrint.forEach(r => {
        const dPk  = Number(r.peak_kwh || 0);
        const dOff = Number(r.off_kwh || 0);
        const dTot = Number(r.kwh || 0);
        const dAmt = Number(r.amount || 0);
        pdfRows += `
          <div class="row">
            <div class="d">${gbDate(r.timestamp)}</div>
            <div class="cell"><div class="k">Peak</div><div class="v"><strong>${fmtKwh(dPk)}</strong> kWh</div></div>
            <div class="cell"><div class="k">Off-peak</div><div class="v"><strong>${fmtKwh(dOff)}</strong> kWh</div></div>
            <div class="cell"><div class="k">Total</div><div class="v"><strong>${fmtKwh(dTot)}</strong> kWh</div></div>
            <div class="cell"><div class="k">ILS</div><div class="v"><strong>${fmtMoney(dAmt)}</strong></div></div>
          </div>
        `;
      });

      const printPart = `
        <div class="pdf-page" style="margin-bottom:16px;">
          <div class="pdf-header">
            <div class="pdf-head-row">
              <div class="pdf-logo">${breaker.name}</div>
              <div class="pdf-title"><div class="t1">Energy Monitoring System</div><div class="t2">${breaker.name} — ${from} → ${to}</div></div>
            </div>
            <div class="pdf-chips"><div class="chip"><strong>Breaker:</strong> ${breaker.name}</div><div class="chip"><strong>ID:</strong> ${breaker.id}</div></div>
          </div>
          <div class="pdf-summary">
            <div class="sum-total"><div class="k">Total due</div><div class="v">${fmtMoney(d.total_amount || 0)} <span style="font-size:13px;font-weight:800;opacity:.75">ILS</span></div></div>
            <div class="sum-box pk"><div class="k">Peak summary</div><div class="v">${fmtKwh(d.peak_kwh || 0)} kWh</div><div class="s">${fmtMoney(d.peak_amount || 0)} ILS</div></div>
            <div class="sum-box op"><div class="k">Off-peak summary</div><div class="v">${fmtKwh(d.offpeak_kwh || 0)} kWh</div><div class="s">${fmtMoney(d.offpeak_amount || 0)} ILS</div></div>
          </div>
          <div class="pdf-section-title"><div class="l">${view === 'monthly' ? 'Monthly records' : 'Daily records'}</div><div class="r">${dailyRowsForPrint.length} ${view === 'monthly' ? 'months' : 'days'}</div></div>
          <div class="rowlist">${pdfRows}</div>
        </div>
      `;
      printParts.push(printPart);
    }

    // render combined UI
    card.innerHTML = parts.join('\n');
    card.classList.add('visible');

    // fill print container with stacked pages
    document.getElementById('print-records').innerHTML = `<div>${printParts.join('\n')}</div>`;

    setStatus('active', 'Multi-breaker report ready');

  } catch (err) {
    console.error('Multi breaker error', err);
    setStatus('', `Error: ${err.message || err}`);
    document.getElementById('no-data').classList.add('visible');
  }
}

/** ✅ Load breakers from API and fill the select */
async function loadBreakersAndFillSelect() {
  const select = document.getElementById("sel-breaker");

  try {
    setStatus("loading", "Loading breakers...");

    const res = await fetch(`${API_BASE}/api/breakers`, { cache: "no-store" });
    if (!res.ok) {
      const t = await res.text().catch(()=> "");
      throw new Error(`Breakers API error (${res.status}): ${t || res.statusText}`);
    }

    const data = await res.json();


    // ✅ data is ARRAY: [{id,name},...]
    const list = Array.isArray(data) ? data : (data.breakers || []);

    // ✅ Build BREAKERS as object map: BREAKERS["1"] = {id:"1", name:"..."}
    BREAKERS = Object.fromEntries(
      list
        .filter(b => b && b.id != null)
        .map(b => {
          const id = String(b.id).trim();
          const name = String(b.name || `Breaker ${id}`).trim();
          return [id, { id, name }];
        })
    );

    // ✅ clear existing options (keep placeholder)
    select.length = 1;

    Object.entries(BREAKERS)
      .sort((a,b) => Number(a[0]) - Number(b[0]))
      .forEach(([key, breaker]) => {
        const option = document.createElement("option");
        option.value = key; // value = breakerId
        option.textContent = `${key} - ${breaker.name}`;
        select.appendChild(option);
      });

    setStatus("", "Ready.");

  } catch (err) {
    console.error("Failed to load breakers:", err);
    BREAKERS = {};
    select.length = 1;
    setStatus("", `Failed to load breakers: ${err.message || err}`);
  }
}

async function generateReport() {
  const breakerId = parseInt(document.getElementById('sel-breaker').value, 10);

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

            <span class="tag pk" style="margin-right:3px">Pk: ${fmtKwh(dPk)}</span>
            <span class="tag op">Off: ${fmtKwh(dOff)}</span>
          </td>
          <td class="n">${fmtKwh(dTot)}</td>

        const dPk  = Number(r.peak_kwh || 0);
        const dOff = Number(r.off_kwh || 0);
        const dTot = Number(r.kwh || 0);
        const dAmt = Number(r.amount || 0);

        tableRows += `<tr>
          <td>${gbDate(r.timestamp)}</td>
          <td>
            <span class="tag pk" style="margin-right:3px">Pk: ${fmtKwh(dPk)}</span>
            <span class="tag op">Off: ${fmtKwh(dOff)}</span>
          </td>
          <td class="n">${fmtKwh(dTot)}</td>
          <td class="n">Mixed</td>
          <td class="n">${fmtMoney(dAmt)}</td>

        chartLabels.push(shortDay(r.timestamp));

        tableRows += `<tr class="${pk ? 'pk-row' : ''}">

          <td class="n">${fmtRate(r.rate)}</td>
          <td class="n">${fmtMoney(r.amount)}</td>
        </tr>`;

        chartLabels.push(hhFromStamp(r.timestamp));
        chartPeak.push(pk ? kwh : 0);
        chartOff.push(pk ? 0 : kwh);
      });
    }

    // ===== PDF rows = ALWAYS DAILY =====
  const dailyRowsForPrint = (view === "daily" || view === "monthly") ? rows : aggregateHourlyToDaily(rows);

    // Build clear "row list" for PDF
    let pdfRows = "";
    dailyRowsForPrint.forEach(r => {
      const dPk  = Number(r.peak_kwh || 0);
      const dOff = Number(r.off_kwh || 0);
      const dTot = Number(r.kwh || 0);
      const dAmt = Number(r.amount || 0);

      pdfRows += `
        <div class="row">
          <div class="d">${gbDate(r.timestamp)}</div>

          <div class="cell">
            <div class="k">Peak</div>
            <div class="v"><strong>${fmtKwh(dPk)}</strong> kWh</div>
          </div>

          <div class="cell">
            <div class="k">Off-peak</div>
            <div class="v"><strong>${fmtKwh(dOff)}</strong> kWh</div>
          </div>

          <div class="cell">
            <div class="k">Total</div>
            <div class="v"><strong>${fmtKwh(dTot)}</strong> kWh</div>
          </div>

          <div class="cell">
            <div class="k">ILS (VAT not included)</div>
            <div class="v"><strong>${fmtMoney(dAmt)}</strong></div>
          </div>
        </div>
      `;
    });

    const pdfTitleText = view === 'monthly' ? 'Monthly Consumption Invoice' : (view === 'daily' ? 'Daily Consumption Invoice' : 'Consumption Records');

    document.getElementById("print-records").innerHTML = `
      <div class="pdf-page">
        <div class="pdf-header">
          <div class="pdf-head-row">
            <div class="pdf-logo">ABB</div>
            <div class="pdf-title">
              <div class="t1">Energy Monitoring System</div>
              <div class="t2">${pdfTitleText}</div>
            </div>
          </div>

          <div class="pdf-chips">
            <div class="chip"><strong>Breaker:</strong> ${breaker.name}</div>
            <div class="chip"><strong>ID:</strong> ${breaker.id}</div>
            <div class="chip"><strong>Period:</strong> ${from} → ${to}</div>
            <div class="chip"><strong>Invoice:</strong> ${invoiceNo}</div>
          </div>
        </div>

        <div class="pdf-summary">
          <div class="sum-total">
            <div class="k">Total due</div>
            <div class="v">${fmtMoney(grand)} <span style="font-size:13px;font-weight:800;opacity:.75">ILS</span></div>
          </div>

          <div class="sum-box pk">
            <div class="k">Peak summary</div>
            <div class="v">${fmtKwh(peakKwh)} kWh</div>
            <div class="s">${fmtMoney(peakAmt)} ILS</div>
          </div>

          <div class="sum-box op">
            <div class="k">Off-peak summary</div>
            <div class="v">${fmtKwh(offKwh)} kWh</div>
            <div class="s">${fmtMoney(offAmt)} ILS</div>
          </div>
        </div>

        <div class="pdf-section-title">
          <div class="l">${view === 'monthly' ? 'Monthly records' : 'Daily records'}</div>
          <div class="r">${dailyRowsForPrint.length} ${view === 'monthly' ? 'months' : 'days'} • ${tariffText}</div>
        </div>

        <div class="rowlist">
          ${pdfRows}
        </div>

        <div class="pdf-footer">
          <div><span class="abb">ABB</span> | Energy Report v1.0</div>
          <div>Before VAT • IEC ToU • Generated: ${today}</div>
        </div>
      </div>
    `;

    // ===== Render app card =====
    card.innerHTML = `
      <div class="rpt-header">
        <div class="rpt-logo">
          <svg width="86" height="28" viewBox="0 0 86 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <text x="0" y="20" font-family="DM Sans, Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">ABB</text>
          </svg>
        </div>
        <div class="rpt-header-right">
          <div class="rpt-type">Energy Report — ${view === 'hourly' ? 'Hourly' : view === 'daily' ? 'Daily' : 'Monthly'} View</div>
          <div class="rpt-name">${breaker.name}</div>
        </div>
      </div>

      <div class="rpt-subbar">
        <span class="sl">Breaker Energy Invoice</span>
        <span class="sr">#${invoiceNo} &nbsp;|&nbsp; ${today}</span>
      </div>

      <div class="rpt-meta">
        <div class="rpt-meta-cell"><div class="ml">Breaker ID</div><div class="mv">${breaker.id}</div></div>
        <div class="rpt-meta-cell"><div class="ml">From</div><div class="mv">${from}</div></div>
        <div class="rpt-meta-cell"><div class="ml">To</div><div class="mv">${to}</div></div>
        <div class="rpt-meta-cell"><div class="ml">Tariff</div><div class="mv">${tariffText}</div></div>
        <div class="rpt-meta-cell"><div class="ml">Total</div><div class="mv">${fmtKwh(totalKwh)} kWh</div></div>
      </div>

      <div class="rpt-legend">
        <div class="rpt-legend-item"><div class="sw pk"></div><span><strong>${peakLine}</strong></span></div>
        <div class="rpt-legend-item"><div class="sw op"></div><span><strong>${offLine}</strong></span></div>
      </div>

      <div class="rpt-body">
        <div class="rpt-chart-panel">
          <div class="rpt-chart-title">&#9650; Consumption — ${view === 'hourly' ? 'Hourly Breakdown' : view === 'daily' ? 'Daily Summary' : 'Monthly Summary'}</div>
          <div class="chart-container"><canvas id="rpt-chart"></canvas></div>

          <div class="chart-pills">
            <div class="pill pk">
              <div class="pl">Peak Hours</div>
              <div class="pv">${fmtKwh(peakKwh)} kWh</div>
              <div class="ps">${fmtMoney(peakAmt)} ILS</div>
            </div>
            <div class="pill op">
              <div class="pl">Off-Peak Hours</div>
              <div class="pv">${fmtKwh(offKwh)} kWh</div>
              <div class="ps">${fmtMoney(offAmt)} ILS</div>
            </div>
          </div>
        </div>

        <div class="rpt-table-panel">
          <div class="rpt-table-wrap" style="padding-top:16px;">
            <table class="rpt-table">
              <thead><tr>
                <th>${view==='hourly'?'Time':'Date'}</th>
                <th>Type</th><th>kWh</th><th>Rate</th><th>ILS</th>
              </tr></thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="rpt-totals">
        <div>
          <div class="rpt-totals-lines">
            <div class="rpt-tot-line-peak"><span>&#9632; Peak — ${fmtKwh(peakKwh)} kWh</span><span class="tv">${fmtMoney(peakAmt)} ILS</span></div>
            <div class="rpt-tot-line-off"><span>&#9632; Off-Peak — ${fmtKwh(offKwh)} kWh</span><span class="tv">${fmtMoney(offAmt)} ILS</span></div>
             <div class="rpt-tot-line-total"><span>&#9632; Total — ${fmtKwh(totalKwh)} kWh</span><span class="tv">${fmtMoney(grand)} ILS</span></div>
          </div>
          <div class="rpt-note">Tariffs are BEFORE VAT — seasonal ToU pricing (IEC)</div>
        </div>

        <div class="rpt-total-box">
          <div class="tbl">Total Due</div>
          <div class="tba">${fmtMoney(grand)}</div>
          <div class="tbc">ILS</div>
        </div>
      </div>

      <div class="rpt-export-bar">
        <button class="btn-print" onclick="printRecordsOnly()">
          <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
          Export to PDF
        </button>
      </div>

      <div class="rpt-footer">
        <span>
          <svg width="72" height="18" viewBox="0 0 86 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <text x="0" y="14" font-family="DM Sans, Arial, sans-serif" font-weight="900" font-size="14" fill="#FF000F">ABB</text>
          </svg>
          Energy Monitoring System | Breaker Report v1.0
        </span>
        <span>energyData.csv | ${today}</span>
      </div>
    `;

    card.classList.add('visible');

    // Chart
    await ensureChart();
    const ctx = document.getElementById('rpt-chart').getContext('2d');
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: chartLabels,
        datasets: [
          { label: 'Peak', data: chartPeak, backgroundColor: 'rgba(255,0,15,0.85)', borderRadius: 2, borderSkipped: false },
          { label: 'Off-Peak', data: chartOff, backgroundColor: 'rgba(26,26,26,0.72)', borderRadius: 2, borderSkipped: false },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { font: { family: 'DM Sans', size: 12, weight: '800' }, boxWidth: 12, boxHeight: 12, padding: 16 } },
          tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y} kWh` } }
        },
        scales: {
          x: { stacked: true, ticks: { font: { family: 'DM Mono', size: 9 }, maxRotation: 55, color: '#888' }, grid: { display: false } },
          y: { stacked: true, title: { display: true, text: 'kWh', font: { family: 'DM Sans', size: 13 }, color: '#aaa' }, ticks: { font: { family: 'DM Mono', size: 11 }, color: '#888' }, grid: { color: '#f0f0f0' } }
        }
      }
    });

  setStatus('active', `Report ready — ${breaker.name} | ${view} view | ${from} → ${to} | PDF = clear rows`);
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    console.error(e);
    setStatus('', `Error: ${e.message || e}`);
    noData.classList.add('visible');
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') generateReport(); });

/* Set sensible default dates for the From/To inputs (YYYY-MM-DD) */
function setDefaultDates() {
  try {
    const fromEl = document.getElementById('sel-from');
    const toEl = document.getElementById('sel-to');
    const now = new Date();
    const toVal = now.toISOString().slice(0,10);
    // set From = yesterday, To = today
    const fromDt = new Date(now);
    fromDt.setDate(fromDt.getDate() - 1);
    const fromVal = fromDt.toISOString().slice(0,10);
    if (fromEl && !fromEl.value) fromEl.value = fromVal;
    if (toEl && !toEl.value) toEl.value = toVal;
  } catch (e) {
    // ignore
  }
}

// ✅ init
setDefaultDates();
loadBreakersAndFillSelect();
</script>
