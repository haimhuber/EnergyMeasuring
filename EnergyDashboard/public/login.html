<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login - ABB Energy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #0f0810;
    --bg-2: #200215;
    --accent: #ff2b2b;
    --card-bg: rgba(70, 70, 73, 0.7);
    --glass-border: rgba(255,255,255,0.04);
    --muted: #bdbdbd;
  }
  html,body{height:100%;}
  body{
    font-family:'DM Sans',sans-serif;
    margin:0;
    display:flex;align-items:center;justify-content:center;
    background: radial-gradient(1200px 600px at 10% 10%, rgba(255,43,43,0.08), transparent 8%),
                radial-gradient(900px 400px at 90% 90%, rgba(0,110,255,0.06), transparent 10%),
                linear-gradient(180deg,var(--bg-1),var(--bg-2));
    color:#fff;
    overflow:hidden;
  }

  /* decorative floating shapes */
  body::before, body::after{
    content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0.25;
  }
  body::before{background: radial-gradient(circle at 20% 30%, rgba(255,40,40,0.12), transparent 12%);}
  body::after{background: radial-gradient(circle at 80% 70%, rgba(0,120,255,0.10), transparent 12%);}

  .card-wrap{position:relative;perspective:1200px}
  .card{
    width:420px; max-width:92vw; padding:28px; border-radius:14px;
    /* darker card to match requested look */
    background: linear-gradient(180deg, rgba(18,18,20,0.98), rgba(12,12,14,0.99));
    backdrop-filter: blur(8px) saturate(120%);
    -webkit-backdrop-filter: blur(8px) saturate(120%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 18px 50px rgba(2,6,23,0.6),
      0 6px 18px rgba(0,0,0,0.6),
      0 1px 0 rgba(255,255,255,0.02) inset;
    transform-style: preserve-3d;
    transition: transform 300ms cubic-bezier(.2,.9,.2,1), box-shadow 300ms;
  }
  .card:hover{ transform: translateY(-6px) scale(1.01); box-shadow: 0 28px 70px rgba(2,6,23,0.72); }

  .card .gloss{position:absolute;left:0;right:0;top:0;height:60px;border-radius:14px 14px 0 0;background:linear-gradient(180deg, rgba(255,255,255,0.06), transparent);pointer-events:none}

  /* header with small red accent */
  .header-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .header-row .accent{width:28px;height:4px;background:var(--accent);border-radius:4px}
  h1{margin:0;font-size:20px;letter-spacing:0.6px;color:#fff}
  p.sub{margin:6px 0 14px;color:var(--muted);font-size:13px}

  label{display:block;font-size:16px;color:var(--muted);margin-top:8px;margin-bottom:6px}
  input[type=text],input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:rgba(8,8,10,0.45);color:#fff;box-shadow: 0 2px 6px rgba(0,0,0,0.6) inset;transition:box-shadow 180ms, transform 180ms}
  input[type=text]:focus,input[type=password]:focus{outline:none;box-shadow:0 6px 30px rgba(255,43,43,0.08), 0 2px 6px rgba(255,255,255,0.02) inset;transform:translateY(-1px);border-color: rgba(255,43,43,0.3)}

  .actions{display:flex;gap:8px;margin-top:18px;align-items:center}
  .btn{background:linear-gradient(180deg,var(--accent),#d61f1f);color:#fff;padding:12px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:800;box-shadow: 0 10px 30px rgba(255,43,43,0.12), 0 2px 8px rgba(0,0,0,0.6);transform:translateZ(24px);transition:transform 180ms, box-shadow 180ms}
  /* ensure the prominent full-width login button keeps the red gradient and white text
    even if a global .btn rule was changed elsewhere */
  .btn.full{width:100%;background:linear-gradient(180deg,var(--accent),#d61f1f);color:#fff;border-radius:10px;padding:12px 16px;text-transform:uppercase}
  .btn:hover{transform:translateZ(26px) translateY(-2px);box-shadow:0 18px 40px rgba(255,43,43,0.14)}
  .btn:active{transform:translateZ(8px);box-shadow:0 6px 18px rgba(0,0,0,0.6)}
  .btn:disabled{opacity:0.6;cursor:not-allowed}

  .msg{margin-top:12px;font-size:13px;color:#f8f8f8}
  .small{font-size:14px;color:#999;margin-top:8px}

  /* floating subtle animation */
  @keyframes floaty { 0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)} }
  .card { animation: floaty 6s ease-in-out infinite; }

  /* responsive */
  @media (max-width:480px){ .card{padding:20px;width:92vw} .btn{width:46%} }
</style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <div class="accent" aria-hidden="true"></div>
      <h1>Log in</h1>
    </div>
    <p class="sub">Sign in to access the Energy Dashboard</p>

    <label for="username">E-mail address</label>
    <input id="username" type="text" autocomplete="username" placeholder="name@example.com" />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />

    <div class="actions">
      <button id="btnLogin" class="btn full">LOGIN</button>
    </div>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>

  </div>

<script>
async function doLogin() {
  const u = document.getElementById('username').value || '';
  const p = document.getElementById('password').value || '';
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnLogin');
  msg.textContent = '';
  if (!u || !p) { msg.textContent = 'Please enter username and password'; return; }
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    const data = await resp.json().catch(()=>({}));
    if (!resp.ok) {
      msg.textContent = data?.detail || 'Login failed';
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }
    // success — server sets HttpOnly cookie; redirect to root
    localStorage.setItem('Username', u); // store last username for convenience
    document.querySelector('#msg').textContent = 'Login successful! Redirecting...';
    setTimeout(() => {
        window.location.href = '/';
    }, 1000); // 1000ms = 1 second
  } catch (e) {
    msg.textContent = e?.message || 'Network error';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

document.getElementById('btnLogin').addEventListener('click', doLogin);
// allow Enter to submit
[document.getElementById('username'), document.getElementById('password')].forEach(el=>el.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') doLogin(); }));

// subtle 3D tilt / parallax on the card
;(function(){
  const card = document.querySelector('.card');
  if (!card) return;
  const wrap = document.createElement('div'); wrap.className = 'card-wrap';
  card.parentNode.insertBefore(wrap, card);
  wrap.appendChild(card);

  let rect = null;
  function onMove(e){
    if (!rect) rect = wrap.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    const rx = (-y) * 6; // rotateX
    const ry = (x) * 8;  // rotateY
    card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(8px)`;
  }
  function onLeave(){ card.style.transform = ''; rect = null; }
  wrap.addEventListener('mousemove', onMove);
  wrap.addEventListener('mouseleave', onLeave);
})();
</script>
</body>
</html>
