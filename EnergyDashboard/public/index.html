<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABB - Energy Report Generator</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- ✅ Chart.js with defer -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="nav">
    <span class="nav-logo">
      <svg width="86" height="20" viewBox="0 0 86 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <text x="-10" y="18" font-family="DM Sans, Arial, sans-serif" font-weight="900" font-size="26"
          fill="#FF000F">ABB</text>
      </svg>
    </span>
    <span class="nav-sub">Energy Monitoring System</span>
    <div class="nav-right">
      <span class="nav-user">Welcome, <span id="nav-username"></span></span>
      <button id="btn-logout" class="btn-logout" style="display:none;">Logout</button>
    </div>
  </div>

  <div class="selector-section">
    <div class="selector-label">Report Generator</div>
    <div class="selector-title">Generate Energy Invoice</div>
    <div class="controls">
      <div class="ctrl-group">
        <label>Breaker</label>
        <select id="sel-breaker">
          <option value="">— Select breaker —</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label>From</label>
        <input type="date" id="sel-from">
      </div>
      <div class="ctrl-group">
        <label>To</label>
        <input type="date" id="sel-to">
      </div>
      <div class="ctrl-group">
        <label>View</label>
        <div class="view-toggle">
          <label><input type="radio" name="view" value="hourly"><span class="vt-btn">Hourly</span></label>
          <label><input type="radio" name="view" value="daily" checked><span class="vt-btn">Daily</span></label>
          <label><input type="radio" name="view" value="monthly"><span class="vt-btn">Monthly</span></label>
        </div>
      </div>
      <button class="btn-generate" onclick="generateReport()">
        Generate <span class="arrow">→</span>
      </button>

      <button class="btn-generate-total-cost" style="background:#222;margin-left:8px; display:inline-block;"
        onclick="generateMultiBreakerReport()">
        Generate Total Cost <span class="arrow">→</span>
      </button>

      <style>
        #breaker-modal * {
          font-family: inherit;
        }

        #breaker-modal {
          direction: rtl;
        }

        #breaker-modal .btn-cancel,
        #breaker-modal .btn-confirm {
          padding: 8px 18px;
          border-radius: 6px;
          border: none;
          font-size: 16px;
          cursor: pointer;
        }

        #breaker-modal .btn-cancel {
          background: #eee;
          color: #222;
        }

        #breaker-modal .btn-confirm {
          background: #1a7f37;
          color: #fff;
        }
      </style>

    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Select a breaker and date range to generate a report.</span>
  </div>

  <div class="report-area">
    <div class="placeholder" id="placeholder">
      <div class="big">
        <svg width="160" height="48" viewBox="0 0 160 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="0" y="36" font-family="DM Sans, Arial, sans-serif" font-weight="900" font-size="36"
            fill="rgba(255,255,255,0.95)">ABB</text>
        </svg>
      </div>
      <div class="sm">Awaiting selection</div>
    </div>
    <div class="no-data" id="no-data">
      <div class="nd-icon">⚡</div>
      <div class="nd-text">No consumption data for this breaker in the selected period.</div>
    </div>
    <div class="report-card" id="report-card"></div>
  </div>

  <!-- ✅ Printable "records only" container -->
  <div id="print-records" class="print-only-records"></div>

  <script src="index.js">

  </script>
</body>

</html>
